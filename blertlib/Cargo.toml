[package]
name = "blert"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[dependencies]
console = { version = "0.16.6", optional = true }
flate2 = { version = "1.1.10", optional = true }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.21"
similar = { version = "3.2.0", features = ["inline"], optional = true }

[dev-dependencies]
blert = { path = ".", features = ["golden"] }
flate2 = "1.1.10"
prost-reflect = { version = "0.16.5", features = ["serde"] }
serde_json = "1.0.151"

[build-dependencies]
prost-build = "0.14.4"
serde_json = "1.0.151"

[features]
golden = ["dep:console", "dep:flate2", "dep:similar"]
