name: Test blertlib

on:
  pull_request:
    paths:
      - 'blertlib/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-blertlib.yml'
  push:
    branches:
      - main
    paths:
      - 'blertlib/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-blertlib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -p blert -- --check

      - name: Lint
        run: cargo clippy -p blert --all-targets -- -D warnings

      - name: Build
        run: cargo build -p blert

      - name: Run tests
        run: cargo test -p blert
