name: Update item cache

# Regenerates web/resources/{extended,simple}_items.json and
# web/resources/item_sprites.json from the latest live OSRS cache
# using the item-cache dumper image, opening a PR on changes.
# Changed item sprites are uploaded to the blert-sprites bucket.
#
# The dumper exists at https://github.com/blert-io/item-cache.

on:
  schedule:
    # Daily at 13:30 UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: update-item-cache
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/blert-io/item-cache:latest

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate item data and upload sprites
        id: regenerate
        env:
          SPRITES_BUCKET: blert-sprites
          SPRITES_PREFIX: items
          S3_ENDPOINT_URL: https://nyc3.digitaloceanspaces.com
          AWS_ACCESS_KEY_ID: ${{ secrets.SPRITES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPRITES_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/osrs-cache" "${RUNNER_TEMP}/sprites"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}/web/resources:/resources" \
            -v "${RUNNER_TEMP}/osrs-cache:/work/cache" \
            -v "${RUNNER_TEMP}/sprites:/sprites" \
            -e SPRITES_DIR=/sprites \
            -e SPRITES_BUCKET -e SPRITES_PREFIX -e S3_ENDPOINT_URL \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            "${IMAGE}"

          uploaded="${RUNNER_TEMP}/sprites/uploaded.txt"
          echo "new-sprites=$(grep -c '^new ' "$uploaded" || true)" >> "$GITHUB_OUTPUT"
          echo "changed-sprites=$(grep -c '^changed ' "$uploaded" || true)" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: web/resources/*.json
          base: main
          branch: automation/item-cache
          delete-branch: true
          commit-message: 'web: Refresh item cache data'
          title: 'web: Refresh item cache data'
          body: |
            Automated regeneration of `web/resources/{extended,simple}_items.json`
            and `web/resources/item_sprites.json` from the latest live OSRS cache
            via the item-cache dumper image.

            Uploaded ${{ steps.regenerate.outputs.new-sprites }} new and
            ${{ steps.regenerate.outputs.changed-sprites }} changed item sprites to
            https://sprites.blert.io/items/.
          labels: |
            automation
