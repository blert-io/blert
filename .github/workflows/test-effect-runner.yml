name: Test Effect Runner

on:
  pull_request:
    paths:
      - 'effect-runner/**'
      - 'common/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/test-effect-runner.yml'
  push:
    branches:
      - main
    paths:
      - 'effect-runner/**'
      - 'common/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/test-effect-runner.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build common
        run: npm run -w common build

      - name: Format check
        run: npm run -w effect-runner format

      - name: Lint
        run: npm run -w effect-runner lint

      - name: Typecheck
        run: npm run -w effect-runner typecheck

      - name: Build effect-runner
        run: npm run -w effect-runner build

      - name: Run tests with coverage
        run: npm run -w effect-runner test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./effect-runner/coverage/lcov.info
          flags: effect-runner
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
